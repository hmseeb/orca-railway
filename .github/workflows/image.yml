name: Build image
# Builds the Railway image to GHCR and runs the contract test against it before
# the tag is pushed. Railway deploys are amd64, so only amd64 is built.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: v
        run: echo "version=$(sed -n 's/^ARG ORCA_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: orca-rw:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ./test/smoke.sh orca-rw:local
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for t in latest ${{ steps.v.outputs.version }}; do
            docker tag orca-rw:local ghcr.io/hmseeb/orca-railway:$t
            docker push ghcr.io/hmseeb/orca-railway:$t
          done
